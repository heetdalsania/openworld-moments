[project]
name = "openworld-moments-contracts"
version = "1.0.0"
description = "Versioned OpenWorld Moments contracts: JSON Schemas and generated Pydantic models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema>=4.26.0",
    "pydantic>=2.14.2",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.91.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-jsonschema>=4.26.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "openworld_moments_contracts"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Generated by datamodel-code-generator; formatting is enforced, style lint is not.
"openworld_moments_contracts/generated/**" = ["E501", "UP", "RUF", "SIM", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["openworld_moments_contracts", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
