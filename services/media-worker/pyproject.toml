[project]
name = "openworld-moments-worker"
version = "0.0.0"
description = "OpenWorld Moments media worker"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography==50.0.2",
    "fastapi>=0.162.0",
    "openworld-moments-contracts",
    "tzdata>=2025.2 ; sys_platform == 'win32'",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[project.scripts]
owm = "openworld_moments.detectors.__main__:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "opencv-python-headless>=4.12,<5",
    "opentimelineio>=0.17,<0.19",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
packaging = [
    "playwright==1.64.1",
    "pyinstaller==6.22.3",
]

[tool.uv.sources]
openworld-moments-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "openworld_moments"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests use deliberate fake tokens and secrets.
"tests/**" = ["S101", "S105", "S106", "S107"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["openworld_moments", "tests"]

# OpenTimelineIO (test-only validator for M27 exports) ships no type information.
[[tool.mypy.overrides]]
module = ["opentimelineio", "opentimelineio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
