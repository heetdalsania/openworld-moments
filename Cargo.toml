[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-or-later"
repository = "https://github.com/heetdalsania/openworld-moments"

# Optimisation guidance: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
