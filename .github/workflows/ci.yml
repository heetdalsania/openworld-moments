# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  typescript:
    name: TypeScript (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check:ts
      - run: pnpm lint:ts
      - run: pnpm typecheck:ts
      - run: pnpm test:ts

  python:
    name: Python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # bash -e on every OS, so a failing command in a multi-line step fails the step.
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-packages
      # Media tests generate synthetic clips with FFmpeg (M04); none are committed.
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install OCR (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -q --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - name: Install OCR (Windows)
        if: runner.os == 'Windows'
        run: choco install tesseract -y --no-progress
      - name: Media tool report (doctor)
        working-directory: services/media-worker
        run: uv run --locked python -m openworld_moments.doctor
      - name: OCR tool report (doctor)
        working-directory: services/media-worker
        run: uv run --locked owm text doctor
      - name: Media worker
        working-directory: services/media-worker
        env:
          OWM_REQUIRE_FFMPEG: "1" # media tests fail instead of skipping without FFmpeg
          OWM_REQUIRE_OCR: "1" # M17 tests require the real local engine and English data
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked mypy
          uv run --locked pytest
      - name: Contracts (Python)
        working-directory: packages/contracts/python
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked mypy
          uv run --locked pytest

  contracts:
    name: Contracts drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --all-packages
      - run: pnpm contracts:check

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      # rustup installs the toolchain pinned in rust-toolchain.toml on first use.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Supervisor integration tests start the real Python worker from .venv.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-packages
      # The import-to-playback E2E test (M09) imports and proxies a synthetic clip.
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -q --no-install-recommends ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        env:
          OWM_REQUIRE_FFMPEG: "1" # the E2E test fails instead of skipping without FFmpeg

  macos:
    # M33/M34: native packaged development builds for Apple Silicon and Intel. Pinned
    # runner images (never macos-latest); each architecture builds and caches on its own
    # native runner. macos-15-intel is GitHub's last Intel image (until about August 2027).
    name: macOS build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            python: cpython-3.12.14-macos-aarch64-none
          - arch: x86_64
            runner: macos-15-intel
            python: cpython-3.12.14-macos-x86_64-none
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Runner is the architecture this job builds
        run: |
          echo "uname -m: $(uname -m); macOS $(sw_vers -productVersion)"
          test "$(uname -m)" = "${{ matrix.arch }}"
          test "$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)" = "0"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos-${{ matrix.arch }}-v2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: macos-${{ matrix.arch }}-v2
      # cryptography ships no Intel macOS wheel. On Intel it is built from source and
      # linked statically against a pinned OpenSSL LTS built for macOS 14 (Homebrew's
      # targets the runner's macOS and would be loaded from outside the app).
      - uses: actions/cache@v6.1.0
        if: matrix.arch == 'x86_64'
        id: openssl-cache
        with:
          path: output/packaging/openssl-x86_64
          key: macos-x86_64-openssl-${{ hashFiles('scripts/macos/openssl.json', 'scripts/macos/build-openssl.sh') }}
      - name: Static OpenSSL for macOS 14 (Intel)
        if: matrix.arch == 'x86_64' && steps.openssl-cache.outputs.cache-hit != 'true'
        run: bash scripts/macos/build-openssl.sh x86_64
      # The pinned python-build-standalone runtime that is frozen into the app (M34).
      # Runtime and packaging packages only.
      - name: Worker environment (managed CPython 3.12.14, runtime packages)
        run: |
          EXTRA=""
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            OPENSSL_DIR="$GITHUB_WORKSPACE/output/packaging/openssl-x86_64"
            OPENSSL_STATIC=1
            MACOSX_DEPLOYMENT_TARGET=14.0
            export OPENSSL_DIR OPENSSL_STATIC MACOSX_DEPLOYMENT_TARGET
            EXTRA="--refresh-package cryptography"  # never reuse a cached dynamic build
          fi
          uv sync $EXTRA --managed-python --locked --all-packages --no-dev --group packaging --python ${{ matrix.python }}
      - run: pnpm install --frozen-lockfile
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: pnpm --filter @openworld-moments/desktop test
      - name: Verify and extract pinned media sources
        run: uv run --locked --no-dev --group packaging --directory services/media-worker python ../../scripts/windows/prepare-sources.py
      - uses: actions/cache@v6.1.0
        id: media-cache
        with:
          path: output/packaging/media
          key: macos-${{ matrix.arch }}-media-${{ hashFiles('scripts/windows/sources.json', 'scripts/macos/build-media.sh') }}
      - name: Build FFmpeg and FFprobe with libx264 only (macOS 14+)
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: |
          if [ "${{ matrix.arch }}" = "x86_64" ]; then brew install nasm; fi
          bash scripts/macos/build-media.sh ${{ matrix.arch }}
      - name: macOS file, process and restart recovery fixtures (M35)
        env:
          OWM_REQUIRE_FFMPEG: "1"
          OWM_FFMPEG: ${{ github.workspace }}/output/packaging/media/ffmpeg
          OWM_FFPROBE: ${{ github.workspace }}/output/packaging/media/ffprobe
        run: >-
          uv run --locked --no-dev --group packaging --with pytest==9.2.0
          --directory services/media-worker pytest
          tests/media/test_macos_recovery.py tests/media/test_process.py tests/media/test_probe_job.py
          tests/worker/test_process.py
      - name: Freeze, audit and inventory the worker
        run: uv run --locked --no-dev --group packaging --directory services/media-worker python ../../scripts/macos/freeze-worker.py
      - name: Host lifecycle, crash recovery and import tests against the frozen worker
        env:
          OWM_REQUIRE_FFMPEG: "1"
        run: |
          RUNTIME="$GITHUB_WORKSPACE/apps/desktop/src-tauri/bundle-input/runtime"
          OWM_WORKER_PYTHON="$RUNTIME/owm-worker" PATH="$RUNTIME/tools:$PATH" \
            cargo test --locked -p openworld-moments-desktop --test supervisor --test library_e2e --test session_e2e
      - name: Keep build-machine paths out of the Rust binary
        run: echo "RUSTFLAGS=--remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$GITHUB_WORKSPACE=/build" >> "$GITHUB_ENV"
      - name: Build the app, verify every Mach-O file and run the version report
        run: python3 scripts/macos/build-shell.py --arch ${{ matrix.arch }}
      - name: Bundled runtime smoke (empty environment, Unicode paths, CPU render, damage)
        run: python3 scripts/macos/runtime-smoke.py "target/${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}-apple-darwin/release/bundle/macos/OpenWorld Moments.app/Contents/Resources/runtime"
      - name: SBOM for this architecture, verified against the runtime; secret and path scan
        run: |
          RUNTIME=../../apps/desktop/src-tauri/bundle-input/runtime
          OUT=../../output/packaging/macos
          RUN="uv run --locked --no-dev --group packaging --with cyclonedx-python-lib[json-validation]==11.12.0 --directory services/media-worker python"
          $RUN ../../scripts/security/sbom.py --inventory $RUNTIME/inventory.json --output $OUT/sbom-macos-${{ matrix.arch }}.cdx.json
          $RUN ../../scripts/security/verify_sbom.py --sbom $OUT/sbom-macos-${{ matrix.arch }}.cdx.json --inventory $RUNTIME/inventory.json --runtime-dir $RUNTIME
          $RUN ../../scripts/security/scan_artifacts.py $RUNTIME \
            "../../target/${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}-apple-darwin/release/openworld-moments-desktop" \
            --exceptions ../../security/artifact-scan-exceptions-macos.json --report $OUT/artifact-scan.json
          cp apps/desktop/src-tauri/bundle-input/runtime/inventory.json output/packaging/macos/runtime-inventory-${{ matrix.arch }}.json
          cp output/packaging/macos-runtime-smoke.json output/packaging/macos/runtime-smoke-${{ matrix.arch }}.json
      - uses: actions/upload-artifact@v7.0.2
        if: success()
        with:
          name: macOS-${{ matrix.arch }}-unsigned-dev
          path: output/packaging/macos/
          if-no-files-found: error
          retention-days: 30

  desktop-build:
    name: Desktop production build (Windows)
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
      # M30: signed build-provenance attestations for release files (pushes to main only).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          key: packaged-windows-x64-v1
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --managed-python --locked --all-packages --no-dev --group packaging --python cpython-3.12.14-windows-x86_64-none
      - name: Verify and extract pinned media sources
        run: uv run --locked --no-dev --group packaging --directory services/media-worker python ../../scripts/windows/prepare-sources.py
      - uses: actions/cache@v6.1.0
        id: media-cache
        with:
          path: output/packaging/media
          key: windows-x64-media-${{ hashFiles('scripts/windows/sources.json', 'scripts/windows/build-media.sh') }}
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        if: steps.media-cache.outputs.cache-hit != 'true'
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm mingw-w64-x86_64-pkgconf make diffutils
      - name: Build GPL FFmpeg with libx264 only
        if: steps.media-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/windows/build-media.sh
      - name: Cache completed media build before downstream packaging
        if: steps.media-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: output/packaging/media
          key: windows-x64-media-${{ hashFiles('scripts/windows/sources.json', 'scripts/windows/build-media.sh') }}
      - name: Freeze and inventory worker
        run: uv run --locked --no-dev --group packaging --directory services/media-worker python ../../scripts/windows/freeze-worker.py
      - name: Repeat frozen build and compare payload
        shell: pwsh
        run: |
          Copy-Item apps/desktop/src-tauri/bundle-input/runtime/inventory.json output/packaging/repro-first.json
          uv run --locked --no-dev --group packaging --directory services/media-worker python ../../scripts/windows/freeze-worker.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item apps/desktop/src-tauri/bundle-input/runtime/inventory.json output/packaging/repro-second.json
          python -c "import json,pathlib;d=pathlib.Path('output/packaging');a=json.loads((d/'repro-first.json').read_text());b=json.loads((d/'repro-second.json').read_text());changed=sorted(k for k in set(a['files'])|set(b['files']) if a['files'].get(k)!=b['files'].get(k));(d/'reproducibility.json').write_text(json.dumps({'frozen_payload_identical':not changed,'changed_files':changed,'installer_bit_reproducibility':'not claimed'}));assert not changed,changed"
      - name: Probe the frozen worker outside the desktop host
        shell: pwsh
        working-directory: apps/desktop/src-tauri/bundle-input/runtime
        run: |
          python ../../../../../scripts/windows/frozen-worker-probe.py (Resolve-Path owm-worker.exe) -m openworld_moments.worker
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep build-machine paths out of Rust binaries
        shell: pwsh
        run: |
          $cargo = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          "RUSTFLAGS=--remap-path-prefix=$cargo=/cargo --remap-path-prefix=$env:GITHUB_WORKSPACE=/build" >> $env:GITHUB_ENV
      - run: pnpm build:windows
      - name: Install, native WebView import/render, repair, upgrade and uninstall retention
        shell: pwsh
        run: scripts/windows/lifecycle-smoke.ps1
      - name: Stage the test-only upgrade installer for client qualification
        shell: pwsh
        run: |
          $upgrade = Get-ChildItem 'target/x86_64-pc-windows-msvc/release/bundle/nsis/*alpha.29.1*-setup.exe' | Select-Object -First 1
          if (-not $upgrade) { throw 'Upgrade package missing' }
          $out = New-Item -ItemType Directory -Force -Path 'output/packaging/upgrade-test'
          Copy-Item -LiteralPath $upgrade.FullName -Destination $out
          $hash = (Get-FileHash -LiteralPath (Join-Path $out $upgrade.Name) -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path (Join-Path $out 'SHA256SUMS.txt') -Value "$hash  $($upgrade.Name)" -Encoding ascii
          Set-Content -Path (Join-Path $out 'README.txt') -Encoding utf8 -Value 'TEST ONLY. Same source and frozen runtime as the candidate with version 0.1.0-alpha.29.1, used solely to exercise the M29 upgrade path on a clean Windows 11 client. Never distribute.'
      - name: Assemble checksums, source, notices and SBOM
        run: uv run --locked --group packaging --directory services/media-worker python ../../scripts/windows/artifacts.py
      - name: Verify the SBOM against the package and scan artifacts for secrets and paths
        shell: bash
        run: |
          uv run --locked --group packaging --directory services/media-worker python ../../scripts/security/verify_sbom.py \
            --sbom ../../output/packaging/release/sbom.cdx.json \
            --inventory ../../apps/desktop/src-tauri/bundle-input/runtime/inventory.json \
            --runtime-dir ../../apps/desktop/src-tauri/bundle-input/runtime \
            --release-dir ../../output/packaging/release
          uv run --locked --group packaging --directory services/media-worker python ../../scripts/security/scan_artifacts.py \
            ../../output/packaging/release \
            ../../apps/desktop/src-tauri/bundle-input/runtime \
            ../../target/x86_64-pc-windows-msvc/release/openworld-moments-desktop.exe \
            --report ../../output/packaging/artifact-scan.json
      - name: Attest build provenance of the release files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: output/packaging/release/*
      - uses: actions/upload-artifact@v7.0.2
        if: success()
        with:
          name: Windows-x64-alpha-candidate
          path: output/packaging/release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: success()
        with:
          name: Windows-x64-upgrade-test-only
          path: output/packaging/upgrade-test/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: Windows-packaging-diagnostics
          path: |
            output/packaging/*json
            output/packaging/media/compiler.txt
            output/packaging/media/build-packages.txt
            output/packaging/freeze-work/owm-worker/warn-owm-worker.txt
          if-no-files-found: ignore

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # secret scanning covers the whole history
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --all-packages
      - name: Secret scan (gitleaks 8.30.1, checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --no-banner .
      - name: Install cargo-audit 0.22.2
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Known vulnerabilities in shipped dependencies
        run: uv run --directory services/media-worker python ../../scripts/security/audit_dependencies.py
      - name: License policy for shipped dependencies
        run: uv run --directory services/media-worker python ../../scripts/security/check_licenses.py --live

  licenses:
    name: License compliance (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uvx --python 3.12 --from "reuse[charset-normalizer]==6.2.0" reuse lint

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - run: scripts/check-dco.sh "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"
