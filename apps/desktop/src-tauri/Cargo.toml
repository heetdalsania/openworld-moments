[package]
name = "openworld-moments-desktop"
version = "0.0.0"
description = "OpenWorld Moments desktop host"
authors = ["OpenWorld Moments contributors"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "openworld_moments_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["process", "io-util", "time", "sync", "macros", "rt-multi-thread", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
getrandom = "0.4"
hex = "0.4"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
tauri-plugin-dialog = "2"
if-addrs = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[dev-dependencies]
tempfile = "3"
